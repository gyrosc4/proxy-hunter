name: Proxy Hunter

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: "Protocol"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - vless
          - vmess
          - trojan
          - ss
          - hysteria2
          - wireguard
      country:
        description: "Country flag - server IP must be in this country"
        required: true
        default: "🌍 Any"
        type: choice
        options:
          - "🌍 Any"
          - "🇺🇸 US"
          - "🇩🇪 DE"
          - "🇳🇱 NL"
          - "🇬🇧 GB"
          - "🇫🇷 FR"
          - "🇯🇵 JP"
          - "🇸🇬 SG"
          - "🇨🇦 CA"
          - "🇫🇮 FI"
      country_code:
        description: "OR type any code(s): SE, TR, PL, AE, IR, IN ... (overrides the flag above)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: proxy-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Get repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install sing-box test engine
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/sb
          gh release download --repo SagerNet/sing-box \
            --pattern '*-linux-amd64.tar.gz' --dir /tmp/sb --clobber
          FILE=$(ls /tmp/sb/*-linux-amd64.tar.gz | head -n 1)
          tar -xzf "$FILE" -C /tmp/sb
          BIN=$(find /tmp/sb -type f -name sing-box | head -n 1)
          sudo install -m 755 "$BIN" /usr/local/bin/sing-box
          sing-box version

      - name: Hunt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROTOCOL: ${{ github.event.inputs.protocol || 'all' }}
          COUNTRY: ${{ github.event.inputs.country_code || github.event.inputs.country || 'any' }}
        run: |
          python nodehunt.py \
            --protocol "$PROTOCOL" \
            --country "$COUNTRY" \
            --top 100 \
            --ws-quota 50 \
            --hu-quota-trojan 70 \
            --out-dir out \
            --max-repos 250 \
            --files-per-repo 6 \
            --harvest-mb 220 \
            --harvest-minutes 6 \
            --max-age-days 60 \
            --discover 400 \
            --batch 100 \
            --concurrency 80 \
            --timeout 2500 \
            --rounds 1 \
            --rounds-final 3 \
            --finalists 280 \
            --max-test 2000 \
            --max-test-other 900 \
            --speed-timeout 8000 \
            --speed-conc 24 \
            --min-kbs 60 \
            --wg-batch 25 \
            --wg-rounds 2 \
            --max-minutes 46 \
            --annotate

      - name: Save results into the repo
        if: always()
        run: |
          git config user.name  "proxy-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f out
          git commit -m "Update configs $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push || echo "Push skipped - use the artifact download"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configs
          path: out/
          if-no-files-found: warn
          retention-days: 30
